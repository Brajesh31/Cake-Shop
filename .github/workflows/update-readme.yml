name: Update README Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: write

concurrency:
  group: cake-shop-readme-update
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update README timestamp
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          TIMESTAMP_LINE="_Last updated: $DATE UTC_"

          if grep -q "Last updated:" README.md; then
            sed -i "s|.*Last updated:.*|$TIMESTAMP_LINE|" README.md
          else
            printf "\\n%s\\n" "$TIMESTAMP_LINE" >> README.md
          fi

      - name: Commit README change when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README timestamp is already current."
            exit 0
          fi
          git commit -m "chore: refresh README timestamp"
          git push origin HEAD:main
