name: 🐛 Bug report
description: Report a reproducible defect in Cake Shop.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please remove private data from screenshots and logs. For security issues, use SECURITY.md instead of a public issue.
  - type: input
    id: route
    attributes:
      label: Affected route
      placeholder: /cakes
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List exact actions needed to see the issue.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
  - type: input
    id: viewport
    attributes:
      label: Viewport size
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or console errors
      description: Remove tokens, personal data, and secrets before sharing.
    validations:
      required: false
